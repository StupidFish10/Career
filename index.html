<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ee">
  <meta name="description" content="Explore careers that fit your interests, strengths, and the way you like to work.">
  <title>Career Explorer — Find your next maybe</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" data-action="home" aria-label="Career Explorer home"><span class="brand-mark" aria-hidden="true">✳</span><span>career<span class="brand-light">explorer</span></span></a>
    <nav class="header-actions" aria-label="Main navigation"><button class="text-button" data-action="saved-code">I have a code</button><button class="button button-small button-dark" data-action="start">Start exploring <span aria-hidden="true">↗</span></button></nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <section id="print-card" aria-hidden="true"></section>
  <dialog id="code-dialog" class="modal"><form method="dialog" class="modal-close"><button aria-label="Close">×</button></form><div id="code-dialog-content"></div></dialog>
  <dialog id="career-dialog" class="modal modal-wide"><form method="dialog" class="modal-close"><button aria-label="Close">×</button></form><div id="career-dialog-content"></div></dialog>
  <dialog id="compare-dialog" class="modal modal-wide"><form method="dialog" class="modal-close"><button aria-label="Close">×</button></form><div id="compare-dialog-content"></div></dialog>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
